<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا - دليل أعطال الأجهزة الكهرومنزلية</title>
  <meta name="description" content="تواصل معنا لطلب إضافة ماركات أو أكواد أخطاء جديدة">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-tools"></i></div>
        <div class="logo-text"><span>دليل الأعطال</span><span>الأجهزة الكهرومنزلية</span></div>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="about.html" class="nav-link">عن الموقع</a>
        <a href="contact.html" class="nav-link active">اتصل بنا</a>
      </nav>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        <button class="menu-toggle"><i class="fas fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main>
    <div class="hero" style="padding: 80px 0 60px;">
      <div class="container">
        <h1>اتصل بنا</h1>
        <p>نحن هنا لمساعدتك واستقبال اقتراحاتك</p>
      </div>
    </div>

    <section class="content-section">
      <div class="container max-w-2xl mx-auto">
        <div class="detail-section reveal">
          <form onsubmit="event.preventDefault(); showToast('تم إرسال الرسالة بنجاح', 'success'); this.reset();">
            <div class="form-group">
              <label>الاسم الكامل</label>
              <input type="text" required placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
              <label>البريد الإلكتروني</label>
              <input type="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
              <label>الموضوع</label>
              <select required>
                <option value="">اختر الموضوع</option>
                <option value="add-brand">طلب إضافة ماركة</option>
                <option value="add-error">طلب إضافة كود خطأ</option>
                <option value="suggestion">اقتراح تحسين</option>
                <option value="other">أخرى</option>
              </select>
            </div>
            <div class="form-group">
              <label>الرسالة</label>
              <textarea required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full">
              <i class="fas fa-paper-plane"></i> إرسال الرسالة
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom"><p>جميع الحقوق محفوظة &copy; 2024</p></div>
    </div>
  </footer>
  <button class="back-to-top"><i class="fas fa-arrow-up"></i></button>
  <script src="assets/js/main.js"></script>
</body>
</html>
