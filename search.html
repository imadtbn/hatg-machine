      </div>

      <div style="max-width:600px;margin:0 auto 30px;">
        <div style="position:relative;">
          <span class="search-icon"
            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--text-secondary);">🔍</span>
          <input type="search" id="searchInput" placeholder="ابحث عن عطل، رمز خطأ، قطعة..."
            style="width:100%;padding:14px 50px 14px 20px;border:2px solid var(--border-color);border-radius:25px;font-size:1rem;font-family:var(--font-arabic);background:var(--bg-card);color:var(--text-primary);outline:none;"
            aria-label="بحث">
        </div>
      </div>

      <div id="searchResults"></div>
      <div id="noResults" style="display:none;text-align:center;padding:40px;color:var(--text-secondary);">

  <script src="assets/js/main.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      const [brandsRes, errorsRes] = await Promise.all([fetch('data/brands.json'), fetch('data/errors.json')]);
      const brands = await brandsRes.json();
      const errors = await errorsRes.json();

      const params = new URLSearchParams(window.location.search);
      const query = params.get('q') || '';
      const searchInput = document.getElementById('searchInput');
      searchInput.value = query;

      if (query) performSearch(query.toLowerCase(), errors, brands);

      searchInput.addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        if (q.length < 2) { document.getElementById('searchResults').innerHTML = ''; document.getElementById('noResults').style.display = 'none'; return; }
        performSearch(q, errors, brands);
      });
    });

    function performSearch(query, errors, brands) {
      const results = [];

      errors.forEach(function (error) {
        const fields = [error.errorCode, error.titleAr, error.brandAr, error.deviceTypeAr, error.categoryAr].filter(Boolean);
        const causes = error.causes || [];
        const allFields = [...fields, ...causes].map(f => f.toLowerCase());

        if (allFields.some(f => f.includes(query))) {
          results.push(`<div class="error-card" style="margin-bottom:16px;"><div class="error-code-display ${error.severity}">${error.errorCode}</div><h3 class="card-title"><a href="error.html?id=${error.id}">${error.titleAr}</a></h3><p class="card-text">${error.symptoms?.[0] || ''}</p><div class="card-meta"><span class="badge badge-primary">${error.deviceTypeAr}</span><span class="badge badge-info">${error.brandAr}</span></div></div>`);
        }
      });

      brands.forEach(function (brand) {
        if (brand.nameAr.includes(query) || brand.name.toLowerCase().includes(query)) {
          results.push(`<div class="brand-card" style="text-align:center;padding:20px;"><h3 class="brand-name"><a href="brand.html?id=${brand.id}">${brand.nameAr}</a></h3><p class="brand-country">${brand.countryAr}</p></div>`);
        }
      });

      const container = document.getElementById('searchResults');
      container.innerHTML = results.join('');
      document.getElementById('noResults').style.display = results.length === 0 ? 'block' : 'none';
    }
  </script>
</body>
